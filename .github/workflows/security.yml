name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install project toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
      - name: Verify formatting
        run: cargo +1.94.1 fmt --all --check
      - name: Run tests
        run: cargo +1.94.1 test --locked --all-targets
      - name: Run Clippy
        run: cargo +1.94.1 clippy --locked --all-targets --all-features -- -D warnings
      - name: Install RustSec audit tool
        run: cargo +1.94.1 install cargo-audit --locked --version 0.22.2
      - name: Audit locked dependencies
        run: cargo +1.94.1 audit
