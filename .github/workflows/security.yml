name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install project toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
      - name: Verify formatting
        run: cargo +1.94.1 fmt --all --check
      - name: Run tests
        run: cargo +1.94.1 test --locked --all-targets
      - name: Run Clippy
        run: cargo +1.94.1 clippy --locked --all-targets --all-features -- -D warnings
      - name: Install RustSec audit tool
        run: cargo +1.94.1 install cargo-audit --locked --version 0.22.2
      - name: Audit locked dependencies
        run: cargo +1.94.1 audit
